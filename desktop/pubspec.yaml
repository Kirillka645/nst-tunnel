name: nst_tunnel_desktop
description: "NST Tunnel — desktop client for Xray-based VPN profiles. Companion to the Android app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + change notification
  provider: ^6.1.2

  # Local persistence (servers, settings)
  shared_preferences: ^2.3.5

  # File chooser for importing .json configs / subscription files
  file_picker: ^8.1.6

  # Open URLs (e.g. donate / repo links)
  url_launcher: ^6.3.1

  # Path resolution, app data dir
  path: ^1.9.0
  path_provider: ^2.1.5

  # HTTP client (subscription fetch, github releases lookup)
  http: ^1.2.2

  # Pre-rendered SVG icons & branding
  flutter_svg: ^2.0.16

  # Cross-platform window management (resize, title, etc.)
  window_manager: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
