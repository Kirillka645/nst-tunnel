name: Build desktop artifacts and attach to release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the desktop builds to (e.g. v2.18.0-nst)"
        required: true
        default: "v2.18.0-nst"

permissions:
  contents: write

env:
  SINGBOX_VERSION: "1.11.4"

jobs:
  windows:
    name: Build Windows x64 (.zip)
    runs-on: windows-latest
    steps:
      - name: Checkout tag ${{ inputs.release_tag }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop
      - name: Generate platform folders
        working-directory: desktop
        run: flutter create --platforms=windows,macos --org com.nsttunnel --project-name nst_tunnel .
      - name: Install dependencies
        working-directory: desktop
        run: flutter pub get
      - name: Build Windows release
        working-directory: desktop
        run: flutter build windows --release
      - name: Download sing-box (Windows)
        shell: pwsh
        run: |
          $ver = "$env:SINGBOX_VERSION"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$ver/sing-box-$ver-windows-amd64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile sb.zip
          Expand-Archive -Path sb.zip -DestinationPath sb_tmp -Force
          $exe = Get-ChildItem -Path sb_tmp -Recurse -Filter sing-box.exe | Select-Object -First 1
          Copy-Item $exe.FullName "desktop\build\windows\x64\runner\Release\sing-box.exe" -Force
          Get-ChildItem "desktop\build\windows\x64\runner\Release\sing-box.exe" | Format-List Length, FullName
      - name: Derive version label from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag }}"
          $ver = $tag -replace '^v','' -replace '-nst$',''
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version=$ver"
      - name: Package release folder as .zip
        shell: pwsh
        working-directory: desktop/build/windows/x64/runner
        run: |
          $zipName = "NSTTunnel-${{ steps.ver.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path Release\* -DestinationPath ..\..\..\..\..\$zipName -Force
          Get-ChildItem ..\..\..\..\..\$zipName | Format-List Length, FullName
      - name: Upload .zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: NSTTunnel-${{ steps.ver.outputs.version }}-windows-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout tag ${{ inputs.release_tag }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop
      - name: Generate platform folders
        working-directory: desktop
        run: flutter create --platforms=windows,macos --org com.nsttunnel --project-name nst_tunnel .
      - name: Install dependencies
        working-directory: desktop
        run: flutter pub get
      - name: Build macOS release
        working-directory: desktop
        run: flutter build macos --release
      - name: Derive version label from tag
        id: ver
        run: |
          tag="${{ inputs.release_tag }}"
          ver="${tag#v}"
          ver="${ver%-nst}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "version=$ver"
      - name: Download sing-box (macOS) and bundle, then create DMG
        working-directory: desktop/build/macos/Build/Products/Release
        run: |
          set -e
          ver="$SINGBOX_VERSION"
          ARCH="arm64"
          if [ "$(uname -m)" = "x86_64" ]; then ARCH="amd64"; fi
          echo "Downloading sing-box $ver $ARCH"
          curl -L -o sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v$ver/sing-box-$ver-darwin-$ARCH.tar.gz"
          mkdir -p sb_tmp && tar -xzf sb.tar.gz -C sb_tmp
          BIN=$(find sb_tmp -name sing-box -type f | head -1)

          APP_ORIG=$(ls -d *.app | head -1)
          mv "$APP_ORIG" "NSTTunnel.app"
          mkdir -p "NSTTunnel.app/Contents/Resources"
          cp "$BIN" "NSTTunnel.app/Contents/Resources/sing-box"
          chmod +x "NSTTunnel.app/Contents/Resources/sing-box"

          STAGE=$(mktemp -d)
          cp -R NSTTunnel.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG_PATH="$GITHUB_WORKSPACE/NSTTunnel-${{ steps.ver.outputs.version }}-macos.dmg"
          hdiutil create -volname "NSTTunnel ${{ steps.ver.outputs.version }}" -srcfolder "$STAGE" -ov -format UDZO "$DMG_PATH"
          ls -lh "$DMG_PATH"
      - name: Upload .dmg to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: NSTTunnel-${{ steps.ver.outputs.version }}-macos.dmg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}